appId: org.research.synspectra
productName: SynSpectra
copyright: Copyright © SynSpectra Authors (Dalian Maritime University)
directories:
  output: release
  buildResources: build
afterSign: scripts/afterSign.cjs
files:
  - dist/**/*
  - package.json
extraResources:
  - from: resources/backend
    to: backend
  - from: resources/app-dist
    to: app-dist
  - from: resources/bin
    to: bin
win:
  target:
    - nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: "SynSpectra-${version}-${arch}-Setup.${ext}"
  shortcutName: "SynSpectra"
mac:
  target:
    - dmg
  category: public.app-category.education
  icon: build/icon.png
linux:
  target:
    - deb
    - AppImage
  category: Education
  icon: build/icon.png
publish: null
